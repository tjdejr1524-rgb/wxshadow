name: Build wxshadow KPM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make

      - name: Clone KernelPatch
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git ${{ github.workspace }}/KernelPatch

      - name: Build with Makefile
        run: |
          make KP_DIR=${{ github.workspace }}/KernelPatch

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxshadow-kpm
          path: |
            wxshadow.kpm
            wxshadow_client
